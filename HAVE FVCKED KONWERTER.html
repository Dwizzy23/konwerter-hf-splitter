<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVE FVCKED Converter</title>

<style>
:root{
--bg:#050507;
--bg2:#10101d;
--main:#6d3cff;
--main2:#3a0ac9;
--green:#41f5b4;
--text:#fff;
--muted:#a8a8c7;
--card:rgba(255,255,255,.06);
--border:rgba(255,255,255,.12);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top left,rgba(58,10,201,.45),transparent 30%),
linear-gradient(135deg,var(--bg),var(--bg2));
color:white;
min-height:100vh;
padding:24px;
}

.app{
max-width:1200px;
margin:auto;
}

.glass{
background:var(--card);
border:1px solid var(--border);
border-radius:28px;
backdrop-filter:blur(16px);
}

header{
display:flex;
align-items:center;
gap:16px;
margin-bottom:28px;
}

.logo{
width:60px;
height:60px;
border-radius:18px;
object-fit:cover;
border:1px solid rgba(255,255,255,.15);
}

.title{
font-size:28px;
font-weight:900;
}

.title span{
display:block;
font-size:12px;
color:var(--muted);
letter-spacing:2px;
margin-top:4px;
}

.hero{
display:grid;
grid-template-columns:1fr 1fr;
gap:24px;
}

.left{
padding:36px;
}

.badge{
display:inline-block;
padding:8px 14px;
border-radius:999px;
background:rgba(109,60,255,.15);
border:1px solid rgba(109,60,255,.3);
margin-bottom:18px;
font-size:13px;
}

h1{
font-size:64px;
line-height:.95;
margin-bottom:22px;
letter-spacing:-3px;
}

.gradient{
background:linear-gradient(90deg,#fff,#8f68ff,#41f5b4);
-webkit-background-clip:text;
color:transparent;
}

.desc{
color:var(--muted);
line-height:1.7;
font-size:16px;
margin-bottom:28px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.stat{
padding:16px;
border-radius:20px;
background:rgba(255,255,255,.05);
border:1px solid var(--border);
}

.stat strong{
font-size:24px;
display:block;
}

.stat span{
font-size:12px;
color:var(--muted);
}

.panel{
padding:24px;
}

.tabs{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:18px;
}

.tab{
padding:14px;
border:none;
border-radius:16px;
background:rgba(255,255,255,.06);
color:white;
font-weight:800;
cursor:pointer;
}

.tab.active{
background:linear-gradient(135deg,var(--main),var(--main2));
}

.tab-content{
display:none;
}

.tab-content.active{
display:block;
}

label{
display:block;
margin-bottom:8px;
font-size:13px;
font-weight:800;
}

input,select{
width:100%;
padding:14px;
border-radius:16px;
border:1px solid var(--border);
background:rgba(0,0,0,.35);
color:white;
margin-bottom:14px;
outline:none;
}

.dropzone{
border:2px dashed rgba(255,255,255,.25);
border-radius:24px;
padding:32px;
text-align:center;
cursor:pointer;
background:rgba(255,255,255,.04);
transition:.2s;
margin-bottom:14px;
}

.dropzone:hover{
border-color:var(--green);
background:rgba(65,245,180,.08);
}

.stems{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:18px;
}

.stem{
padding:14px;
border-radius:18px;
background:rgba(255,255,255,.05);
border:1px solid var(--border);
display:flex;
align-items:center;
gap:8px;
font-weight:700;
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:18px;
font-size:16px;
font-weight:900;
cursor:pointer;
background:linear-gradient(135deg,var(--main),var(--main2));
color:white;
}

.results{
margin-top:24px;
padding:24px;
}

.job{
padding:18px;
border-radius:22px;
background:rgba(255,255,255,.04);
border:1px solid var(--border);
margin-bottom:16px;
}

.progress{
height:10px;
border-radius:999px;
overflow:hidden;
background:rgba(255,255,255,.08);
margin:12px 0;
}

.progress-fill{
height:100%;
width:0%;
background:linear-gradient(90deg,var(--main),var(--green));
transition:.3s;
}

.files{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:16px;
}

.file{
padding:12px;
border-radius:14px;
background:rgba(0,0,0,.3);
border:1px solid var(--border);
font-size:12px;
}

.file button{
width:100%;
margin-top:8px;
padding:8px;
border:none;
border-radius:10px;
cursor:pointer;
background:rgba(255,255,255,.1);
color:white;
font-weight:700;
}

@media(max-width:900px){
.hero{
grid-template-columns:1fr;
}
.stems,.files,.stats{
grid-template-columns:1fr 1fr;
}
h1{
font-size:48px;
}
}

@media(max-width:560px){
.stems,.files,.stats{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="app">

<header>
<img class="logo" src="https://i.imgur.com/7f7ZK9S.png">
<div class="title">
HAVE FVCKED
<span>AI AUDIO TOOLS</span>
</div>
</header>

<div class="hero">

<div class="left glass">
<div class="badge">YT / SC / Upload → WAV</div>

<h1>
HF <span class="gradient">Converter</span>
</h1>

<div class="desc">
Wrzuć plik audio i pobierz WAV. Splitter tworzy demo stemów vocal, drums, bass i melody.
</div>

<div class="stats">
<div class="stat">
<strong>WAV</strong>
<span>export audio</span>
</div>

<div class="stat">
<strong>4</strong>
<span>AI stems</span>
</div>

<div class="stat">
<strong>HF</strong>
<span>converter</span>
</div>
</div>
</div>

<div class="panel glass">

<div class="tabs">
<button class="tab active" onclick="setTab('link',this)">Link</button>
<button class="tab" onclick="setTab('upload',this)">Upload</button>
</div>

<div id="tab-link" class="tab-content active">
<label>Link YouTube / SoundCloud</label>
<input id="audioLink" placeholder="https://youtube.com/...">
</div>

<div id="tab-upload" class="tab-content">

<input id="fileInput" type="file" accept="audio/*" hidden>

<div class="dropzone" onclick="fileInput.click()">
<strong>Kliknij albo przeciągnij plik</strong>
<br>
<span id="fileName">Brak pliku</span>
</div>

</div>

<label>Format</label>

<select id="format">
<option value="wav">WAV 48 kHz</option>
</select>

<div class="stems">

<label class="stem">
<input type="checkbox" class="stemCheck" value="vocal" checked>
🎙 Vocal
</label>

<label class="stem">
<input type="checkbox" class="stemCheck" value="drums" checked>
🥁 Drums
</label>

<label class="stem">
<input type="checkbox" class="stemCheck" value="bass" checked>
🎸 Bass
</label>

<label class="stem">
<input type="checkbox" class="stemCheck" value="melody" checked>
🎹 Melody
</label>

</div>

<button class="btn" onclick="createJob()">
START
</button>

</div>

</div>

<div class="results glass">
<h2 style="margin-bottom:18px">Wyniki</h2>
<div id="jobList">Brak wyników.</div>
</div>

</div>

<script>

let currentTab='link';
let selectedFile=null;
let jobs=[];

function setTab(tab,btn){
currentTab=tab;

document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
btn.classList.add('active');

document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
document.getElementById('tab-'+tab).classList.add('active');
}

const fileInput=document.getElementById('fileInput');

fileInput.addEventListener('change',()=>{
if(fileInput.files[0]){
selectedFile=fileInput.files[0];
document.getElementById('fileName').textContent=selectedFile.name;
}
});

function getSelectedStems(){
return [...document.querySelectorAll('.stemCheck')]
.filter(c=>c.checked)
.map(c=>c.value);
}

async function createJob(){

if(currentTab==='upload' && !selectedFile){
alert('Dodaj plik audio');
return;
}

const stems=getSelectedStems();

const job={
id:Date.now(),
title:selectedFile ? selectedFile.name : 'Demo Link',
progress:0,
done:false,
files:[],
stems
};

jobs.unshift(job);

renderJobs();

if(selectedFile){
await processFile(job);
}else{
simulateDemo(job);
}
}

async function processFile(job){

job.progress=10;
renderJobs();

const arrayBuffer=await selectedFile.arrayBuffer();

job.progress=40;
renderJobs();

const AudioCtx=window.AudioContext || window.webkitAudioContext;
const ctx=new AudioCtx();

const audioBuffer=await ctx.decodeAudioData(arrayBuffer);

job.progress=70;
renderJobs();

const wavBlob=audioBufferToWavBlob(audioBuffer);

job.files.push({
name:'HAVE_FVCKED.wav',
blob:wavBlob,
icon:'🎧'
});

job.stems.forEach(stem=>{
job.files.push({
name:stem+'.wav',
blob:wavBlob,
icon:'🎵'
});
});

job.progress=100;
job.done=true;

renderJobs();
}

function simulateDemo(job){

const timer=setInterval(()=>{

job.progress+=10;

if(job.progress>=100){

job.progress=100;
job.done=true;

job.files.push({
name:'demo.txt',
blob:new Blob(['Demo']),
icon:'📄'
});

clearInterval(timer);
}

renderJobs();

},400);

}

function renderJobs(){

const list=document.getElementById('jobList');

if(!jobs.length){
list.innerHTML='Brak wyników.';
return;
}

list.innerHTML=jobs.map(job=>`

<div class="job">

<div style="font-weight:900">${job.title}</div>

<div class="progress">
<div class="progress-fill" style="width:${job.progress}%"></div>
</div>

<div>${job.progress}%</div>

${job.done ? `

<div class="files">

${job.files.map((f,i)=>`

<div class="file">

${f.icon} ${f.name}

<button onclick="downloadFile(${job.id},${i})">
Pobierz
</button>

</div>

`).join('')}

</div>

` : ''}

</div>

`).join('');

}

function downloadFile(jobId,index){

const job=jobs.find(j=>j.id===jobId);

if(!job) return;

const file=job.files[index];

const url=URL.createObjectURL(file.blob);

const a=document.createElement('a');

a.href=url;
a.download=file.name;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);

}

function audioBufferToWavBlob(buffer){

const numChannels=buffer.numberOfChannels;
const sampleRate=buffer.sampleRate;
const length=buffer.length * numChannels * 2 + 44;

const arrayBuffer=new ArrayBuffer(length);
const view=new DataView(arrayBuffer);

let offset=0;

function writeString(str){
for(let i=0;i<str.length;i++){
view.setUint8(offset++,str.charCodeAt(i));
}
}

writeString('RIFF');
view.setUint32(offset,36 + buffer.length * numChannels * 2,true);
offset+=4;

writeString('WAVE');

writeString('fmt ');
view.setUint32(offset,16,true);
offset+=4;

view.setUint16(offset,1,true);
offset+=2;

view.setUint16(offset,numChannels,true);
offset+=2;

view.setUint32(offset,sampleRate,true);
offset+=4;

view.setUint32(offset,sampleRate * numChannels * 2,true);
offset+=4;

view.setUint16(offset,numChannels * 2,true);
offset+=2;

view.setUint16(offset,16,true);
offset+=2;

writeString('data');

view.setUint32(offset,buffer.length * numChannels * 2,true);
offset+=4;

for(let i=0;i<buffer.length;i++){

for(let ch=0;ch<numChannels;ch++){

let sample=buffer.getChannelData(ch)[i];

sample=Math.max(-1,Math.min(1,sample));

view.setInt16(
offset,
sample < 0 ? sample * 0x8000 : sample * 0x7FFF,
true
);

offset+=2;

}

}

return new Blob([arrayBuffer],{type:'audio/wav'});

}

</script>

</body>
</html>
